name: ClaudeWatch
options:
  bundleIdPrefix: com.tanushmalhotra
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 6ZU4RD8G9A
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  ClaudeWatchKit:
    path: ClaudeWatchKit

targets:
  ClaudeWatch:
    type: application
    platform: iOS
    sources: [PhoneApp]
    dependencies:
      - package: ClaudeWatchKit
      - target: ClaudeWatchWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tanushmalhotra.claudewatch
        PRODUCT_NAME: ClaudeWatch
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
    info:
      path: PhoneApp/Info.plist
      properties:
        CFBundleDisplayName: ClaudeWatch
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        KeychainAccessGroup: $(AppIdentifierPrefix)com.tanushmalhotra.claudewatch.shared
        NSAppTransportSecurity: {NSAllowsLocalNetworking: true}
        CFBundleURLTypes:
          - CFBundleURLName: com.tanushmalhotra.claudewatch.pair
            CFBundleURLSchemes: [claudewatch]
    entitlements:
      path: PhoneApp/ClaudeWatch.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.tanushmalhotra.claudewatch.shared

  ClaudeWatchWatch:
    type: application
    platform: watchOS
    sources: [WatchApp]
    dependencies:
      - package: ClaudeWatchKit
      - target: ClaudeWatchWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tanushmalhotra.claudewatch.watchkitapp
        PRODUCT_NAME: ClaudeWatch
        SKIP_INSTALL: YES
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: Claude
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.tanushmalhotra.claudewatch
        KeychainAccessGroup: $(AppIdentifierPrefix)com.tanushmalhotra.claudewatch.shared
        NSAppTransportSecurity: {NSAllowsLocalNetworking: true}
    entitlements:
      path: WatchApp/ClaudeWatchWatch.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.tanushmalhotra.claudewatch.shared

  ClaudeWatchWidgets:
    type: app-extension
    platform: watchOS
    sources: [WatchWidgets]
    dependencies:
      - package: ClaudeWatchKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tanushmalhotra.claudewatch.watchkitapp.widgets
        PRODUCT_NAME: ClaudeWatchWidgets
        SKIP_INSTALL: YES
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Claude
        KeychainAccessGroup: $(AppIdentifierPrefix)com.tanushmalhotra.claudewatch.shared
        NSAppTransportSecurity: {NSAllowsLocalNetworking: true}
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: WatchWidgets/ClaudeWatchWidgets.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.tanushmalhotra.claudewatch.shared
